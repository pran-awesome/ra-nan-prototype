# หน้าเว็บ (ra-nan-web): push เข้า main = ขึ้นจริง, เปิด PR = ได้ลิงก์ preview ไม่กระทบเว็บจริง
name: Web

on:
  push:
    branches: [main]
    paths:
      - "public/**"
      - "wrangler.jsonc"
      - "package.json"
      - ".github/workflows/web.yml"
  pull_request:
    paths:
      - "public/**"
      - "wrangler.jsonc"
      - "package.json"
      - ".github/workflows/web.yml"
  workflow_dispatch:

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://ra-nan-web.pranpan-som.workers.dev
    steps:
      - uses: actions/checkout@v4
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.151.2"
          command: deploy

  preview:
    # PR จาก fork ไม่มีสิทธิ์อ่าน secret จึงข้าม
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.151.2"
          # อัปโหลดเป็นเวอร์ชันใหม่โดยไม่ deploy เว็บจริงยังเป็นเวอร์ชันเดิม
          command: versions upload --preview-alias pr-${{ github.event.pull_request.number }} --message "PR #${{ github.event.pull_request.number }}"
      - name: ใส่ลิงก์ preview ใน PR
        uses: actions/github-script@v7
        with:
          script: |
            const url = `https://pr-${context.issue.number}-ra-nan-web.pranpan-som.workers.dev`;
            const marker = "<!-- ra-nan-preview -->";
            const body = `${marker}\n🔍 Preview หน้าเว็บ: ${url}\n(อัปเดตทุกครั้งที่ push เข้า PR นี้ ใช้ฐานข้อมูลจริงเหมือนเว็บจริง)`;
            const { data: comments } = await github.rest.issues.listComments({ ...context.repo, issue_number: context.issue.number });
            const old = comments.find((c) => c.body.includes(marker));
            if (old) await github.rest.issues.updateComment({ ...context.repo, comment_id: old.id, body });
            else await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });
